<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Metohelp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cadastro.css">
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="cadastro-container">
    
    <!-- ETAPA 1: Inserir E-mail e Senha -->
    <section id="step-1" class="step-card active">
      <h1>Vamos iniciar sua jornada!</h1>
      <form id="form-step-1">
        <div class="field-group">
          <label for="email">Insira seu e-mail:</label>
          <input type="email" id="email" required autocomplete="email">
        </div>

        <div class="field-group">
          <label for="password">Defina uma senha:</label>
          <div class="password-wrapper">
            <input type="password" id="password" required autocomplete="new-password">
            <button type="button" id="toggle-signup-password" class="toggle-password" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </section>

    <!-- ETAPA 2 e 3: Escolher Nome de Usuário (e erro de duplicado) -->
    <section id="step-2" class="step-card">
      <div id="error-msg" class="error-notification" style="display: none;">
        Uh oh... Parece que já existe um usuário com esse nome. Tente outro!
      </div>
      <h2>Escolha seu usuário:</h2>
      <form id="form-step-2">
        <div class="field-group">
          <input type="text" id="username" required autocomplete="username">
        </div>
        <button type="submit" class="btn-primary">Pronto</button>
      </form>
    </section>

    <!-- ETAPA 4: Tudo Pronto / Escolher Estilo do Card -->
    <section id="step-4" class="step-card">
      <h2 class="success-title">Perfeito! Tudo pronto para estudarmos.</h2>
      
      <div class="cards-preview-container">
        <!-- Card Ciano -->
        <div class="preview-card card-cyan" data-theme="cyan">
          <span class="preview-name display-username">Nome</span>
        </div>
        <!-- Card Limão -->
        <div class="preview-card card-lime selected" data-theme="lime">
          <span class="preview-name display-username">Nome</span>
        </div>
        <!-- Card Laranja -->
        <div class="preview-card card-orange" data-theme="orange">
          <span class="preview-name display-username">Nome</span>
        </div>
      </div>

      <button type="button" id="btn-finalize" class="btn-primary">Finalizar</button>
    </section>

  </main>

  <script src="cadastro.js"></script>
</body>
</html>
